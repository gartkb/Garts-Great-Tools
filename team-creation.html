<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GW2 Team Builder V7</title>
  
  <style>
    /* --- CORE STYLES --- */
    :root {
      --bg-gradient: linear-gradient(135deg, #1a2a6c, #2c3e50);
      --glass-dark: rgba(0, 0, 0, 0.4);
      --glass-lighter: rgba(0, 0, 0, 0.2);
      --accent-blue: #3498db;
      --accent-hover: #2980b9;
      --accent-red: #e74c3c;
      --border-color: rgba(52, 152, 219, 0.3);
      --text-main: #ecf0f1;
      --text-muted: #bdc3c7;
      --card-bg: #2a3b4c;
    }

    * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    
    body { 
      background: var(--bg-gradient); 
      color: var(--text-main); 
      padding: 20px; 
      min-height: 100vh; 
    }

    .container { max-width: 1600px; margin: 0 auto; }
    
    header { text-align:center; padding:20px 0; margin-bottom:30px; border-bottom:1px solid var(--border-color); }
    h1 { font-size:2.5rem; color:var(--accent-blue); margin-bottom:10px; text-shadow:0 0 10px rgba(52,152,219,0.5); }
    
    /* --- CONTROLS --- */
    .controls-area {
      background: var(--glass-dark);
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 20px;
      border: 1px solid var(--border-color);
      display: flex; flex-direction: column; gap: 15px;
    }
    
    .roster-actions {
      display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
      padding-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    textarea {
      width: 100%; height: 120px;
      background: rgba(0,0,0,0.3); border: 1px solid var(--border-color);
      color: #fff; padding: 10px; border-radius: 5px;
      resize: vertical; font-family: monospace; font-size: 0.9em;
    }
    textarea:focus { outline: none; border-color: var(--accent-blue); background: rgba(0,0,0,0.5); }

    input[type="text"], select {
      background: rgba(0,0,0,0.3); border: 1px solid #555;
      color: white; padding: 8px 12px; border-radius: 4px;
    }

    button { 
      padding:10px 20px; background:var(--accent-blue); color:white; border:none; border-radius:5px; 
      cursor:pointer; font-weight:bold; transition:all .3s; 
      display: inline-flex; align-items: center; gap: 5px;
    }
    button:hover { background:var(--accent-hover); transform:translateY(-2px); }
    button.btn-danger { background: var(--accent-red); }
    button.btn-danger:hover { background: #c0392b; }

    /* --- LAYOUT --- */
    .builder-layout {
      display: grid; grid-template-columns: 380px 1fr; gap: 20px; align-items: start;
    }
    @media (max-width: 1100px) { .builder-layout { grid-template-columns: 1fr; } }

    /* --- BENCH (SCROLLABLE & STICKY UPDATES) --- */
    .bench-panel {
      background: var(--glass-dark); 
      border: 1px solid var(--border-color);
      border-radius: 10px; 
      padding: 15px;
      
      /* STICKY & SCROLL LOGIC */
      position: sticky;
      top: 20px; /* Sticks 20px from top of window */
      height: calc(100vh - 40px); /* Max height fits viewport */
      display: flex;
      flex-direction: column;
      z-index: 10;
    }

    .panel-header {
      font-size: 1.2rem; color: var(--accent-blue); margin-bottom: 15px;
      display: flex; justify-content: space-between; align-items: center;
      flex-shrink: 0; /* Prevents header from shrinking */
    }

    /* --- BENCH FILTER --- */
    .bench-filter {
      flex-shrink: 0;
      margin: -5px 0 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .bench-filter.hidden { display: none; }
    .filter-chips { display: flex; flex-wrap: wrap; gap: 5px; }
    .filter-chip {
      position: relative;
      display: inline-flex; align-items: center; justify-content: center; gap: 4px;
      min-width: 44px; height: 34px; padding: 0 7px;
      border-radius: 17px; background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.12);
      cursor: pointer; user-select: none; font-size: 1.1rem;
      transition: all 0.15s;
    }
    .filter-chip:hover { background: rgba(255,255,255,0.14); }
    .filter-chip img { height: 22px; width: auto; pointer-events: none; }
    .filter-chip .chip-label { font-size: 0.7rem; }
    .filter-chip .chip-count {
      font-size: 0.72rem; font-weight: 700; color: var(--text-muted);
      min-width: 12px; text-align: center;
    }
    .filter-chip.empty { opacity: 0.3; }
    .filter-chip.active {
      background: rgba(52, 152, 219, 0.3); border-color: var(--accent-blue);
      box-shadow: 0 0 8px rgba(52, 152, 219, 0.45); opacity: 1;
    }
    .filter-chip.active .chip-count { color: #fff; }
    .filter-tools {
      display: flex; align-items: center; gap: 8px; margin-top: 8px;
      font-size: 0.78rem; color: var(--text-muted);
    }
    .filter-tools button {
      padding: 3px 9px; font-size: 0.75rem; font-weight: 600; border-radius: 4px;
      background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
    }
    .filter-tools button:hover { background: rgba(255,255,255,0.18); transform: none; }
    .filter-tools button.mode-on { background: var(--accent-blue); border-color: var(--accent-blue); }
    .filter-tools .spacer { flex-grow: 1; }
    .img-fallback {
      font-size: 0.65rem; font-weight: 600; line-height: 1.1;
      color: var(--text-main); white-space: nowrap;
    }
    .bench-empty-msg { color: var(--text-muted); font-size: 0.85rem; text-align: center; padding: 20px 10px; }

    /* Target the bench drop zone specifically for scrolling */
    #bench-zone {
      overflow-y: auto;
      flex-grow: 1; /* Takes remaining space */
      padding-right: 5px;
      min-height: 200px;
    }

    /* Custom Scrollbar for Bench */
    #bench-zone::-webkit-scrollbar { width: 8px; }
    #bench-zone::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); border-radius: 4px; }
    #bench-zone::-webkit-scrollbar-thumb { background: var(--accent-blue); border-radius: 4px; }
    #bench-zone::-webkit-scrollbar-thumb:hover { background: var(--accent-hover); }

    /* GRID */
    .squad-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 15px;
    }

    .subgroup {
      background: rgba(255,255,255,0.03); border: 1px solid #444; border-radius: 8px;
      display: flex; flex-direction: column;
    }
    .subgroup-header {
      background: rgba(0,0,0,0.3); padding: 8px 12px; font-weight: bold;
      border-bottom: 1px solid #444; font-size: 0.9rem; border-radius: 8px 8px 0 0;
    }
    .drop-zone {
      min-height: 60px; padding: 8px; transition: background 0.2s;
    }
    /* Bench zone handled by ID above, generic drop zones grow */
    .subgroup .drop-zone { flex-grow: 1; }

    .drop-zone.drag-over { background: rgba(52, 152, 219, 0.2); border: 1px dashed var(--accent-blue); }

    /* --- PLAYER CARD --- */
    .player-card {
      background: var(--card-bg); border: 1px solid #3d566e; border-radius: 6px;
      padding: 10px; margin-bottom: 10px; cursor: grab; user-select: none;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
    .player-card:active { cursor: grabbing; }
    .player-card.drop-before { box-shadow: 0 -4px 0 -1px var(--accent-blue), 0 2px 5px rgba(0,0,0,0.2); }
    .player-card.drop-end { box-shadow: 0 4px 0 -1px var(--accent-blue), 0 2px 5px rgba(0,0,0,0.2); }
    
    .card-row { margin-bottom: 6px; }
    .card-row.name-row { font-weight: 700; font-size: 1rem; color: white; display:flex; justify-content:space-between; align-items: center;}
    .card-row.label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 3px; margin-top: 8px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 4px; }
    
    .li-badge {
      display: inline-flex; align-items: center; gap: 3px; margin-left: 8px;
      padding: 1px 7px; border-radius: 10px; font-size: 0.75rem; font-weight: 700;
      background: rgba(155, 89, 182, 0.25); border: 1px solid rgba(155, 89, 182, 0.7); color: #e8d5f5;
      white-space: nowrap;
    }
    .li-icon { height: 16px; width: 16px; }
    .li-badge.none .li-icon { opacity: 0.5; }
    .li-badge.loading { opacity: 0.6; }
    .li-badge.none { background: rgba(255,255,255,0.05); border-color: #666; color: var(--text-muted); font-weight: 400; }
    .name-main { display: flex; align-items: center; flex-wrap: wrap; min-width: 0; }
    .remove-btn { color: #e74c3c; font-size: 1.2rem; cursor: pointer; padding: 0 5px; opacity: 0.6; }
    .remove-btn:hover { opacity: 1; }

    .emoji-container { display: flex; flex-wrap: wrap; gap: 4px; min-height: 28px; }

    .role-btn {
      padding: 3px 6px; border-radius: 4px; background: rgba(255,255,255,0.05);
      border: 1px solid transparent; cursor: pointer; opacity: 0.6; transition: all 0.2s;
      font-size: 1.2rem; display: flex; align-items: center; justify-content: center;
      min-width: 32px; min-height: 32px;
    }
    .role-btn:hover { opacity: 0.9; background: rgba(255,255,255,0.15); transform: scale(1.1); }
    .role-btn.active {
      opacity: 1; background: rgba(52, 152, 219, 0.25); border-color: var(--accent-blue);
      box-shadow: 0 0 8px rgba(52, 152, 219, 0.4);
    }
    .role-btn img { height: 24px; width:auto; pointer-events: none; }

    .output-section {
      margin-top: 30px; background: var(--glass-dark); padding: 20px;
      border-radius: 10px; border: 1px solid var(--border-color);
    }
    #finalOutput { height: 150px; font-family: monospace; }

    /* --- HISTORY MODAL --- */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0; top: 0;
      width: 100%; height: 100%;
      overflow: auto;
      background-color: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
    }
    .modal-content {
      background-color: var(--card-bg);
      margin: 8% auto;
      padding: 20px;
      border: 1px solid var(--border-color);
      width: 90%;
      max-width: 750px;
      border-radius: 10px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      max-height: 75vh;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 12px;
      margin-bottom: 15px;
      flex-shrink: 0;
    }
    .modal-header h2 {
      font-size: 1.5rem;
      color: var(--accent-blue);
    }
    .close-modal {
      color: var(--text-muted);
      font-size: 28px;
      font-weight: bold;
      cursor: pointer;
      line-height: 1;
    }
    .close-modal:hover {
      color: #fff;
    }
    .history-list {
      overflow-y: auto;
      flex-grow: 1;
      padding-right: 8px;
    }
    .history-list::-webkit-scrollbar { width: 8px; }
    .history-list::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); border-radius: 4px; }
    .history-list::-webkit-scrollbar-thumb { background: var(--accent-blue); border-radius: 4px; }
    
    .history-item {
      display: flex;
      flex-direction: column;
      padding: 10px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      font-size: 0.95rem;
    }
    .history-item:last-child {
      border-bottom: none;
    }
    .history-item-top {
      display: flex;
      justify-content: space-between;
      margin-bottom: 5px;
      flex-wrap: wrap;
      gap: 5px;
    }
    .history-timestamp {
      color: var(--text-muted);
      font-size: 0.8rem;
      font-family: monospace;
    }
    .history-details {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .history-action-text {
      font-weight: bold;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 2px 6px;
      border-radius: 3px;
    }
    
    /* Action Status Colors */
    .action-add {
      background: rgba(46, 204, 113, 0.15);
      color: #2ecc71;
      border: 1px solid rgba(46, 204, 113, 0.3);
    }
    .action-remove {
      background: rgba(231, 76, 60, 0.15);
      color: var(--accent-red);
      border: 1px solid rgba(231, 76, 60, 0.3);
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>GW2 Team Builder</h1>
  </header>

  <div class="controls-area">
    <div class="roster-actions">
      <input type="text" id="rosterName" placeholder="Roster Name">
      <button onclick="saveRoster()">💾 Save</button>
      <select id="rosterList" onchange="if(this.value) loadRosterByName(this.value)">
        <option value="">-- Load Roster --</option>
      </select>
      <button class="btn-danger" onclick="deleteRoster()">🗑️</button>
      <button id="viewHistoryBtn" onclick="openHistoryModal()" style="display: none; background-color: #8e44ad;">📜 Show History</button>
    </div>

    <p style="color:#aaa; font-size:0.9em; margin-bottom:5px;">Paste your player list below. (Drag & Drop sorting below)</p>
    <textarea id="inputPlayers" placeholder="Example:
<797945111794810930> DiscordUser#1234, 🛡️ :healheart:
1.Light109, 📧 💫 ⚔️ 🛡️
#2.Zojja, :QuickDPS: 🔥
##3.NewPlayer.1234, :AlacHeal:
Gart Finderboom, 🛡️ 🕵️‍♂️"></textarea>
    <div>
      <button onclick="parseAndGenerate()">⚡ Parse Players</button>
      <button id="lookupLiBtn" onclick="lookupLegendaryInsights()" style="background:#8e44ad;">💎 Look Up LI</button>
      <span id="lookupStatus" style="color:#aaa; font-size:0.85em; margin-left:8px;"></span>
    </div>
  </div>

  <div class="builder-layout">
    <div class="bench-panel">
      <div class="panel-header">
        <span>The Bench</span>
        <span id="benchCount">0</span>
      </div>
      <div id="benchFilter" class="bench-filter hidden"></div>
      <div id="bench-zone" class="drop-zone" data-group="Unassigned"></div>
    </div>
    <div class="squad-grid" id="squadGrid"></div>
  </div>

  <div class="output-section">
    <div class="panel-header">
      <span>Output</span>
      <button onclick="generateOutput()">🔄 Refresh Text</button>
    </div>
    <div style="margin-bottom:10px; display:flex; gap:15px;">
      <label><input type="checkbox" id="includeMentions" checked onchange="generateOutput()"> Include Mentions</label>
      <label><input type="checkbox" id="hideNames" onchange="generateOutput()"> Icons Only</label>
    </div>
    <textarea id="finalOutput" readonly onclick="this.select()"></textarea>
  </div>
</div>

<!-- --- HISTORY MODAL HTML --- -->
<div id="historyModal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h2>📜 Roster Sign-up & React History</h2>
      <span class="close-modal" onclick="closeHistoryModal()">&times;</span>
    </div>
    <div id="historyList" class="history-list">
      <!-- Generated rows appear here -->
    </div>
  </div>
</div>

<script>
  /* =========================================
     DATA & CONFIG
     ========================================= */
  
  const standardRoles = [
    { name: 'QuickDPS', discordtext: ':QuickDPS:', img: 'https://cdn.discordapp.com/emojis/1038159940164014090.png' },
    { name: 'QuickHeal', discordtext: ':QuickHeal:', img: 'https://cdn.discordapp.com/emojis/1038159941472620655.png' },
    { name: 'AlacHeal', discordtext: ':AlacHeal:', img: 'https://cdn.discordapp.com/emojis/1038159938335277140.png' },
    { name: 'AlacDPS', discordtext: ':AlacDPS:', img: 'https://cdn.discordapp.com/emojis/1038159937391562843.png' },
    { name: 'Heal', discordtext: ':healheart:', img: 'https://cdn.discordapp.com/emojis/1436465472509050982.png' },
    { name: 'Tank', text: '🛡️' },
    { name: 'DPS', text: '⚔️' },
    { name: 'BoonDPS', text: '⚡' },
  ];

  // Strictly decorative (will be removed from NAME, but allowed in ROLES)
  const ignoredEmojis = ['📧', '🚹', '🚺', '👥', '👤', '💫', '🔍', '🔰', '🆔', '🔱', '🌠' ];

  let allPlayers = []; 
  let loadedHistory = [];

  // Bench filter state
  let benchFilter = new Set();   // normalized role keys currently selected
  let benchFilterMode = 'any';   // 'any' = has at least one selected role, 'all' = has every selected role

  /* =========================================
     INIT
     ========================================= */
  window.onload = function() {
    initSquadGrid();
    populateRosterList();
    const bench = document.getElementById('bench-zone');
    bench.ondragover = handleDragOver;
    bench.ondrop = handleDrop;

    // Check for "roster" URL parameter
    const urlParams = new URLSearchParams(window.location.search);
    const rosterFile = urlParams.get('roster');
    if (rosterFile) {
      const safeFileName = rosterFile.replace(/[^a-zA-Z0-9_\-\.]/g, '');
      if (safeFileName.endsWith('.json')) {
        fetchRoster(safeFileName);
      }
    }
  };

  function initSquadGrid() {
    const grid = document.getElementById('squadGrid');
    grid.innerHTML = '';
    for (let i = 1; i <= 10; i++) {
      const col = document.createElement('div');
      col.className = 'subgroup';
      col.innerHTML = `
        <div class="subgroup-header">Group ${i}</div>
        <div class="drop-zone" data-group="Group ${i}" ondragover="handleDragOver(event)" ondrop="handleDrop(event)"></div>
      `;
      grid.appendChild(col);
    }
  }

  /* =========================================
     SMARTER PASTE HANDLER
     ========================================= */
  document.getElementById('inputPlayers').addEventListener('paste', function(e) {
    e.preventDefault();
    const clipboardData = (e.clipboardData || window.clipboardData).getData('text');
    
    // 1. Normalize line endings
    const normalized = clipboardData.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
    const rawLines = normalized.split('\n');
    const outputLines = [];

    // REGEX HELPERS
    const startOfPlayerRegex = /^(\d+[\.\)]|#|•|➤)/;
    const continuationStartRegex = /^(\s*,|\s*<|:|[\u{10000}-\u{10FFFF}]|\p{Extended_Pictographic})/u;

    for (let i = 0; i < rawLines.length; i++) {
      let line = rawLines[i].trim();
      if (!line) continue;

      if (outputLines.length === 0) {
        outputLines.push(line);
        continue;
      }

      const prevIndex = outputLines.length - 1;
      const prevLine = outputLines[prevIndex];

      // --- LOGIC GATES ---

      // 1. If line starts with a COMMA, it is ALWAYS a continuation.
      if (line.startsWith(',')) {
        outputLines[prevIndex] = prevLine + line;
        continue;
      }

      // 2. Check for other Continuation Signals (Emojis, brackets)
      if (continuationStartRegex.test(line)) {
        // EDGE CASE: Name starts with Emoji (e.g. "👑 King, ⚔️")
        // If it starts with an emoji BUT has a comma later, assume it's a New Player.
        if (line.includes(',')) {
          outputLines.push(line); // Treat as New Player
        } else {
          outputLines[prevIndex] = prevLine + ' ' + line; // Treat as Merge
        }
        continue;
      }

      // 3. Explicit New Player (Numbers/Bullets)
      if (startOfPlayerRegex.test(line)) {
        outputLines.push(line);
        continue;
      }

      // 4. "Chie" Fix (Contextual Merge)
      if (startOfPlayerRegex.test(prevLine) && !prevLine.includes(',')) {
         outputLines[prevIndex] = prevLine + ' ' + line;
         continue;
      }

      // Default: New Line
      outputLines.push(line);
    }

    const processedText = outputLines.join('\n');
    
    // Insert text
    const input = e.target;
    const start = input.selectionStart;
    const end = input.selectionEnd;
    const currentVal = input.value;
    input.value = currentVal.substring(0, start) + processedText + currentVal.substring(end);
  });

  /* =========================================
     KILLPROOF.ME LEGENDARY INSIGHT LOOKUP
     ========================================= */
  const kpCache = {};   // lowercase account -> { li, title } (li = number, or null if not found)

  // Pulls a GW2 account name ("Name.1234") out of the name portion of a roster line.
  // 1. "(Acct.1234)" in brackets is definitely the account.
  // 2. Otherwise the whole name may be the account, e.g. "💫☄️Gartner Kinderboom.5019".
  // Returns null when no "Name.1234" pattern is present (e.g. "veritius_of_dawn").
  function extractAccountName(namePart) {
    const acctRegex = /([\p{L}\p{N}_'’][\p{L}\p{N}_'’ -]*?)\s*\.\s*(\d{4})(?!\d)/u;
    const strip = s => s.replace(/[\p{Extended_Pictographic}️‍]/gu, '').replace(/\s+/g, ' ').trim();

    const bracketed = [...namePart.matchAll(/\(([^()]*)\)/g)];
    for (let i = bracketed.length - 1; i >= 0; i--) {
      const m = strip(bracketed[i][1]).match(new RegExp('^' + acctRegex.source + '$', 'u'));
      if (m) return m[1].trim() + '.' + m[2];
    }

    const whole = strip(namePart.replace(/<[^>]*>/g, '').replace(/\b\d{17,20}\b/g, ''));
    const m = whole.match(new RegExp('^' + acctRegex.source + '$', 'u'));
    return m ? m[1].trim() + '.' + m[2] : null;
  }

  const LI_ICON = '<img class="li-icon" src="https://render.guildwars2.com/file/6D33B7387BAF2E2CC9B5D37D1D1B01246AB6FA22/1302744.png" alt="LI">';

  function liBadgeHtml(player) {
    if (!player.account) return '';
    if (player.li === 'loading') return `<span class="li-badge loading" title="Looking up ${escapeHtml(player.account)}…">${LI_ICON} …</span>`;
    if (typeof player.li === 'number') {
      return `<span class="li-badge" title="${escapeHtml(player.account)}${player.liTitle ? '\n' + escapeHtml(player.liTitle) : ''}">${LI_ICON} ${player.li}</span>`;
    }
    if (player.li === null) return `<span class="li-badge none" title="${escapeHtml(player.account)} not found on killproof.me (or API is private)">${LI_ICON} ?</span>`;
    return '';
  }

  async function fetchLi(account) {
    const key = account.toLowerCase();
    if (kpCache[key] !== undefined) return kpCache[key];
    let result = { li: null };
    try {
      const res = await fetch(`https://killproof.me/api/kp/${encodeURIComponent(account)}?lang=en`);
      if (res.ok) {
        const data = await res.json();
        const amountOf = (list, id, name) => {
          const it = (list || []).find(i => i.id === id || i.name === name);
          return it ? it.amount : 0;
        };
        const LI = [77302, 'Legendary Insight'], LD = [88485, 'Legendary Divination'], UFE = [94020, 'Unstable Fractal Essence'];
        const own = data.killproofs || [];
        const linked = Array.isArray(data.linked) ? data.linked : [];
        // linked_totals is killproof's own sum across this account and all linked accounts
        // (present only when accounts are linked); fall back to the account's own numbers.
        const totals = (data.linked_totals && data.linked_totals.killproofs) || own;

        let title = `LI ${amountOf(totals, ...LI)} · LD ${amountOf(totals, ...LD)} · UFE ${amountOf(totals, ...UFE)}`;
        if (linked.length) {
          title += '\nLinked accounts:\n' +
            [data.account_name || account, ...linked.map(l => l.account_name)].map((n, i) =>
              `  ${n}: ${amountOf(i === 0 ? own : linked[i - 1].killproofs, ...LI)} LI`).join('\n');
        }
        result = { li: amountOf(totals, ...LI), title };
      } else if (res.status !== 404) {
        return { li: null, transient: true };   // don't cache rate-limits / server errors
      }
    } catch (e) {
      return { li: null, transient: true };
    }
    kpCache[key] = result;
    return result;
  }

  async function lookupLegendaryInsights() {
    const targets = allPlayers.filter(p => p.account);
    const status = document.getElementById('lookupStatus');
    const btn = document.getElementById('lookupLiBtn');
    if (!targets.length) { status.textContent = 'No players with a Name.1234 account found. Parse players first.'; return; }

    btn.disabled = true;
    targets.forEach(p => { p.li = 'loading'; });
    renderAllCards();

    let done = 0, failed = 0;
    const queue = [...targets];
    const worker = async () => {
      while (queue.length) {
        const p = queue.shift();
        const r = await fetchLi(p.account);
        p.li = r.li;
        p.liTitle = r.title;
        if (r.transient) failed++;
        status.textContent = `Looked up ${++done}/${targets.length}…`;
        renderAllCards();
      }
    };
    await Promise.all([worker(), worker(), worker()]);

    const skipped = allPlayers.length - targets.length;
    status.textContent = `Done. ${targets.length} looked up` +
      (skipped ? `, ${skipped} with no account name` : '') +
      (failed ? `, ${failed} failed (try again)` : '') + '.';
    btn.disabled = false;
  }

  /* =========================================
     PARSING LOGIC
     ========================================= */
  function parseAndGenerate() {
    const text = document.getElementById('inputPlayers').value.trim();
    if(!text) return;

    allPlayers = [];
    const lines = text.split('\n');
    const prefixRegex = /^(?:#*\d+\.?\s*)/;

    lines.forEach((line, index) => {
      let cleanLine = line.trim().replace(prefixRegex, '');
      if (!cleanLine) return;

      // Split by LAST comma
      const lastCommaIndex = cleanLine.lastIndexOf(',');
      let namePart = cleanLine;
      let rolePart = '';

      if (lastCommaIndex !== -1) {
        namePart = cleanLine.substring(0, lastCommaIndex).trim();
        rolePart = cleanLine.substring(lastCommaIndex + 1).trim();
      }

      // Extract ID & Name
      let discordMention = null;
      let displayName = namePart;

      // Robust ID search
      const idMatch = displayName.match(/(?:<@!?|<|)?(\d{17,20})(?:>|)?/);
      if (idMatch) {
        discordMention = `<@${idMatch[1]}>`;
        displayName = displayName.replace(idMatch[0], '').trim();
      }

      // Clean decorative emojis from Name
      ignoredEmojis.forEach(e => { displayName = displayName.replace(new RegExp(e, 'g'), ''); });
      displayName = displayName.replace(/\s+/g, ' ').trim() || 'Unknown';

      // Parse Offered Roles
      const offeredRoles = [];
      const emojiRegex = /<a?:[a-zA-Z0-9_]+:\d+>|:[a-zA-Z0-9_]+:|\p{Extended_Pictographic}/gu;
      let match;
      while ((match = emojiRegex.exec(rolePart)) !== null) {
        let token = match[0];
        if(!ignoredEmojis.includes(token)) {
          offeredRoles.push(token);
        }
      }

      const account = extractAccountName(namePart);
      const cached = account ? kpCache[account.toLowerCase()] : undefined;

      allPlayers.push({
        id: 'p-' + index + '-' + Date.now(),
        name: displayName,
        account: account,
        li: cached ? cached.li : undefined,
        liTitle: cached ? cached.title : undefined,
        discordMention: discordMention,
        offeredRoles: offeredRoles,
        activeRoles: new Set(),
        group: 'Unassigned'
      });
    });

    renderAllCards();
    generateOutput();
  }

  /* =========================================
     ICON IMAGES WITH TEXT FALLBACK
     ========================================= */

  // Builds an <img> for a remote icon. If the image can't load (blocked, offline, CDN down),
  // it is swapped for a small text label with the role/emoji name.
  function iconImg(src, label, style) {
    const l = escapeHtml(label || '?');
    return `<img src="${src}" alt="${l}" data-label="${l}" onerror="imgFallback(this)"${style ? ` style="${style}"` : ''}>`;
  }

  function imgFallback(img) {
    const span = document.createElement('span');
    span.className = 'img-fallback';
    span.textContent = img.dataset.label || img.alt || '?';
    img.replaceWith(span);
  }

  /* =========================================
     BENCH FILTER
     ========================================= */

  // Normalizes a role token so different spellings of the same icon match:
  //   "<:QuickDPS:1038...>" -> ":quickdps:",  ":QuickDPS:" -> ":quickdps:",  "🛡️" / "🛡" -> "🛡"
  function roleKey(token) {
    if (!token) return '';
    const custom = token.match(/^<a?:([a-zA-Z0-9_]+):\d+>$/);
    if (custom) return ':' + custom[1].toLowerCase() + ':';
    if (/^:[a-zA-Z0-9_]+:$/.test(token)) return token.toLowerCase();
    return token.replace(/[\uFE0F\u200D]/g, '');
  }

  function standardRoleForKey(key) {
    return standardRoles.find(r => roleKey(r.discordtext || r.text) === key);
  }

  function playerRoleKeys(p) {
    return new Set((p.offeredRoles || []).map(roleKey));
  }

  function playerMatchesFilter(p) {
    if (benchFilter.size === 0) return true;
    const keys = playerRoleKeys(p);
    const wanted = [...benchFilter];
    return benchFilterMode === 'all' ? wanted.every(k => keys.has(k)) : wanted.some(k => keys.has(k));
  }

  // Builds the icon shown on a filter chip, from a standard role or a sample token seen in the roster.
  function chipContent(key, sampleToken) {
    const std = standardRoleForKey(key);
    if (std) return { html: std.img ? iconImg(std.img, std.name) : std.text, name: std.name };
    const custom = sampleToken && sampleToken.match(/<a?:([a-zA-Z0-9_]+):(\d+)>/);
    if (custom) return { html: iconImg(`https://cdn.discordapp.com/emojis/${custom[2]}.png`, custom[1]), name: custom[1] };
    if (key.startsWith(':')) return { html: `<span class="chip-label">${escapeHtml(key.replace(/:/g, ''))}</span>`, name: key };
    return { html: escapeHtml(sampleToken || key), name: sampleToken || key };
  }

  function renderBenchFilter() {
    const bar = document.getElementById('benchFilter');
    const benchPlayers = allPlayers.filter(p => p.group === 'Unassigned');

    if (allPlayers.length === 0) { bar.classList.add('hidden'); bar.innerHTML = ''; return; }
    bar.classList.remove('hidden');

    // Count bench players per role, and remember one raw token per key for display
    const counts = {};
    const samples = {};
    allPlayers.forEach(p => (p.offeredRoles || []).forEach(t => {
      const k = roleKey(t);
      if (!samples[k] || /^<a?:/.test(t)) samples[k] = t;
    }));
    benchPlayers.forEach(p => playerRoleKeys(p).forEach(k => { counts[k] = (counts[k] || 0) + 1; }));

    // Standard roles first (fixed order), then any other icons people signed up with
    const stdKeys = standardRoles.map(r => roleKey(r.discordtext || r.text));
    const extraKeys = Object.keys(samples)
      .filter(k => !stdKeys.includes(k))
      .sort((a, b) => (counts[b] || 0) - (counts[a] || 0));
    benchFilter.forEach(k => { if (!stdKeys.includes(k) && !extraKeys.includes(k)) extraKeys.push(k); });

    const chips = document.createElement('div');
    chips.className = 'filter-chips';
    [...stdKeys, ...extraKeys].forEach(key => {
      const n = counts[key] || 0;
      const { html, name } = chipContent(key, samples[key]);
      const chip = document.createElement('div');
      chip.className = 'filter-chip' + (benchFilter.has(key) ? ' active' : '') + (n === 0 ? ' empty' : '');
      chip.title = `${name}: ${n} on bench offered this`;
      chip.innerHTML = `${html}<span class="chip-count">${n}</span>`;
      chip.addEventListener('click', () => toggleBenchFilter(key));
      chips.appendChild(chip);
    });

    const tools = document.createElement('div');
    tools.className = 'filter-tools';
    tools.innerHTML = `<span>Match:</span>`;
    ['any', 'all'].forEach(mode => {
      const b = document.createElement('button');
      b.textContent = mode === 'any' ? 'Any' : 'All';
      b.title = mode === 'any' ? 'Show players who offered at least one selected role' : 'Show players who offered every selected role';
      if (benchFilterMode === mode) b.classList.add('mode-on');
      b.addEventListener('click', () => { benchFilterMode = mode; renderAllCards(); });
      tools.appendChild(b);
    });
    const spacer = document.createElement('span');
    spacer.className = 'spacer';
    tools.appendChild(spacer);
    if (benchFilter.size > 0) {
      const clear = document.createElement('button');
      clear.textContent = '✕ Clear';
      clear.addEventListener('click', () => { benchFilter.clear(); renderAllCards(); });
      tools.appendChild(clear);
    }

    bar.innerHTML = '';
    bar.appendChild(chips);
    bar.appendChild(tools);
  }

  function toggleBenchFilter(key) {
    if (benchFilter.has(key)) benchFilter.delete(key);
    else benchFilter.add(key);
    renderAllCards();
  }

  /* =========================================
     RENDERING (UPDATED FOR CUSTOM EMOJIS)
     ========================================= */
  function renderAllCards() {
    const bench = document.getElementById('bench-zone');
    bench.innerHTML = '';
    document.querySelectorAll('.squad-grid .drop-zone').forEach(el => el.innerHTML = '');
    
    let benchTotal = 0, benchShown = 0;
    allPlayers.forEach(player => {
      let zone = null;
      if (player.group !== 'Unassigned') zone = document.querySelector(`.drop-zone[data-group="${player.group}"]`);

      if (zone) {
        zone.appendChild(createPlayerCard(player));
      } else {
        benchTotal++;
        if (playerMatchesFilter(player)) {
          bench.appendChild(createPlayerCard(player));
          benchShown++;
        }
      }
    });

    if (benchTotal > 0 && benchShown === 0) {
      bench.innerHTML = '<div class="bench-empty-msg">No bench players match the selected icons.</div>';
    }

    document.getElementById('benchCount').innerText =
      benchFilter.size > 0 ? `${benchShown} / ${benchTotal}` : benchTotal;

    renderBenchFilter();
  }

  function createPlayerCard(player) {
    const el = document.createElement('div');
    el.className = 'player-card';
    el.draggable = true;
    el.id = player.id;
    
    el.addEventListener('dragstart', (e) => {
      e.dataTransfer.setData('text/plain', player.id);
      el.style.opacity = '0.5';
    });
    el.addEventListener('dragend', () => {
      el.style.opacity = '1';
      generateOutput();
    });

    let html = `<div class="card-row name-row">
        <span class="name-main"><span>${player.name}</span>${liBadgeHtml(player)}</span>
        <span class="remove-btn" onclick="removePlayer('${player.id}')">×</span>
      </div>`;

    // Offered Roles
    if(player.offeredRoles.length > 0) {
      html += `<div class="card-row label">Offered</div><div class="emoji-container">`;
      player.offeredRoles.forEach((roleStr) => {
        
        // 1. Is it a specific Custom ID? <a:Name:123>
        const customIdMatch = roleStr.match(/<a?:.+:(\d+)>/);
        
        // 2. Try match standard role by full string OR by shortcode name
        let std = standardRoles.find(r => r.discordtext === roleStr || r.text === roleStr);
        if (!std && customIdMatch) {
           // Fallback: Check if the name inside the ID matches a standard role
           // e.g. < :QuickDPS: 123 >
           const shortCodeMatch = roleStr.match(/:[a-zA-Z0-9_]+:/);
           if (shortCodeMatch) {
              std = standardRoles.find(r => r.discordtext === shortCodeMatch[0]);
           }
        }

        let displayContent = roleStr;
        
        if (customIdMatch) {
           // Use Discord CDN for custom IDs
           const emojiId = customIdMatch[1];
           const emojiName = (roleStr.match(/<a?:([^:]+):/) || [])[1] || (std && std.name);
           displayContent = iconImg(`https://cdn.discordapp.com/emojis/${emojiId}.png`, emojiName);
        } else if (std && std.img) {
           // Use Predefined Standard Image
           displayContent = iconImg(std.img, std.name);
        } else if (roleStr.startsWith(':')) {
           // Text Shortcode
           displayContent = `<span style="font-size:0.7em;">${roleStr.replace(/:/g,'')}</span>`;
        }

        const isActive = player.activeRoles.has(roleStr) ? 'active' : '';
        html += `<div class="role-btn ${isActive}" onclick="toggleRole('${player.id}', '${roleStr}')" title="${roleStr}">${displayContent}</div>`;
      });
      html += `</div>`;
    }

    // Standard Roles
    html += `<div class="card-row label">Assign</div><div class="emoji-container">`;
    standardRoles.forEach(role => {
       const val = role.discordtext || role.text;
       const isActive = player.activeRoles.has(val) ? 'active' : '';
       const content = role.text ? role.text : iconImg(role.img, role.name);
       html += `<div class="role-btn ${isActive}" onclick="toggleRole('${player.id}', '${val}')" title="${role.name}">${content}</div>`;
    });
    html += `</div>`;

    el.innerHTML = html;
    return el;
  }

  function toggleRole(pid, roleValue) {
    const p = allPlayers.find(x => x.id === pid);
    if(!p) return;
    if(p.activeRoles.has(roleValue)) p.activeRoles.delete(roleValue);
    else p.activeRoles.add(roleValue);
    renderAllCards();
    generateOutput();
  }

  function removePlayer(pid) {
    if(!confirm('Remove player?')) return;
    allPlayers = allPlayers.filter(p => p.id !== pid);
    renderAllCards();
    generateOutput();
  }

  // Returns the card in `zone` the pointer is above (i.e. the drop should insert before it), or null for "at the end".
  function getDropTargetCard(zone, y) {
    const cards = [...zone.querySelectorAll('.player-card')].filter(c => c.style.opacity !== '0.5');
    return cards.find(c => {
      const r = c.getBoundingClientRect();
      return y < r.top + r.height / 2;
    }) || null;
  }

  function clearDropIndicators() {
    document.querySelectorAll('.drop-before, .drop-end').forEach(el => el.classList.remove('drop-before', 'drop-end'));
  }

  function handleDragOver(e) {
    e.preventDefault();
    const zone = e.currentTarget;
    zone.classList.add('drag-over');
    clearDropIndicators();
    const target = getDropTargetCard(zone, e.clientY);
    if (target) target.classList.add('drop-before');
    else {
      const cards = zone.querySelectorAll('.player-card:not([style*="opacity: 0.5"])');
      if (cards.length) cards[cards.length - 1].classList.add('drop-end');
    }
  }

  function handleDrop(e) {
    e.preventDefault();
    const zone = e.currentTarget;
    zone.classList.remove('drag-over');
    const pid = e.dataTransfer.getData('text/plain');
    const p = allPlayers.find(x => x.id === pid);
    clearDropIndicators();
    if(p) {
      const target = getDropTargetCard(zone, e.clientY);
      const beforeId = target ? target.id : null;

      // Order within a group follows order in allPlayers: remove, then re-insert at the drop position.
      allPlayers = allPlayers.filter(x => x.id !== pid);
      p.group = zone.dataset.group;
      const idx = beforeId ? allPlayers.findIndex(x => x.id === beforeId) : -1;
      if (idx >= 0) allPlayers.splice(idx, 0, p);
      else allPlayers.push(p);

      renderAllCards();
      generateOutput();
    }
  }

  // Remove stale highlights when a drag leaves a zone or ends without a drop
  document.addEventListener('dragend', () => {
    clearDropIndicators();
    document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
  });
  document.addEventListener('dragleave', (e) => {
    const zone = e.target.closest && e.target.closest('.drop-zone');
    if (zone && !zone.contains(e.relatedTarget)) {
      zone.classList.remove('drag-over');
      clearDropIndicators();
    }
  });

  /* =========================================
     OUTPUT
     ========================================= */
  function generateOutput() {
    const includeMentions = document.getElementById('includeMentions').checked;
    const hideNames = document.getElementById('hideNames').checked;
    
    const groups = {};
    const unassigned = [];
    allPlayers.forEach(p => {
      if(p.group === 'Unassigned') unassigned.push(p);
      else {
        if(!groups[p.group]) groups[p.group] = [];
        groups[p.group].push(p);
      }
    });

    let out = '';
    const sortedKeys = Object.keys(groups).sort((a,b) => parseInt(a.replace(/\D/g,'')) - parseInt(b.replace(/\D/g,'')));

    sortedKeys.forEach(g => {
      out += `**${g}**\n`;
      groups[g].forEach(p => {
        let line = '';
        if(includeMentions && p.discordMention) line += p.discordMention + ' ';
        if(!hideNames) line += p.name;
        
        if(p.activeRoles.size > 0) {
          if(line.trim().length > 0) line += ' - ';
          line += Array.from(p.activeRoles).join(' ');
        }
        out += line.trim() + '\n';
      });
      out += '\n';
    });

    if(unassigned.length > 0) {
      out += `**Unassigned** (${unassigned.length})\n`;
      unassigned.forEach(p => out += `${p.name}\n`);
    }

    document.getElementById('finalOutput').value = out.trim();
  }

  /* =========================================
     REMOTE ROSTER FETCHING & HISTORY
     ========================================= */
  function fetchRoster(fileName) {
    const url = `./teams/${fileName}`;
    fetch(url)
      .then(response => {
        if (!response.ok) {
          throw new Error(`Failed to load roster file: ${response.statusText}`);
        }
        return response.json();
      })
      .then(data => {
        let rawText = '';
        
        // Load history data if present
        loadedHistory = data.history || [];
        updateHistoryButtonState();
        
        // 1. Prefer using the raw text representation if available
        if (data.text_representation) {
          rawText = data.text_representation;
          // Extract the portion inside the markdown code block (```) if it exists
          const codeBlockMatch = rawText.match(/```(?:[a-zA-Z]*\n)?([\s\S]*?)```/);
          if (codeBlockMatch) {
            rawText = codeBlockMatch[1].trim();
          }
          // Remove backslash escaping for Discord custom emojis (e.g., \<:AlacHeal:...)
          rawText = rawText.replace(/\\</g, '<');
        } 
        // 2. Fall back to manual reconstruction if the structured list exists
        else if (data.roster && Array.isArray(data.roster)) {
          rawText = data.roster.map((player, idx) => {
            const idPart = player.discord_id ? `<${player.discord_id}> ` : '';
            const nickname = player.nickname || '';
            const emojis = player.emojis ? player.emojis.join(' ') : '';
            return `${idx + 1}. ${idPart}${nickname}, ${emojis}`;
          }).join('\n');
        }

        if (rawText) {
          document.getElementById('inputPlayers').value = rawText;
          
          // Pre-populate Roster Name field with the filename (without extension)
          const nameWithoutExt = fileName.replace('.json', '');
          document.getElementById('rosterName').value = nameWithoutExt;
          
          // Parse and build the board cards automatically
          parseAndGenerate();
        }
      })
      .catch(err => {
        console.error('Error fetching roster:', err);
        alert('Could not load the specified roster. Please check the file name and try again.');
      });
  }

  function updateHistoryButtonState() {
    const btn = document.getElementById('viewHistoryBtn');
    if (loadedHistory && loadedHistory.length > 0) {
      btn.style.display = 'inline-flex';
    } else {
      btn.style.display = 'none';
    }
  }

  /* =========================================
     HISTORY MODAL LOGIC
     ========================================= */
  function openHistoryModal() {
    const list = document.getElementById('historyList');
    list.innerHTML = '';

    if (!loadedHistory || loadedHistory.length === 0) {
      list.innerHTML = '<div style="color: var(--text-muted); text-align: center; padding: 20px;">No history details found.</div>';
    } else {
      // Sort newest entries first
      const sorted = [...loadedHistory].sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

      sorted.forEach(item => {
        const itemEl = document.createElement('div');
        itemEl.className = 'history-item';

        const rawAction = item.action || '';
        const lowerAction = rawAction.toLowerCase();
        
        // Categorize actions to flag them as green (joining/positive) or red (leaving/undoing)
        const isNegative = lowerAction.includes('unreact') || 
                           lowerAction.includes('uninterest') || 
                           lowerAction.includes('remove') || 
                           lowerAction.includes('leave') || 
                           lowerAction.includes('unregistered') ||
                           lowerAction.includes('delete');
                           
        const actionClass = isNegative ? 'action-remove' : 'action-add';
        const formattedTime = formatHistoryTimestamp(item.timestamp);
        const formattedEmoji = formatHistoryEmoji(item.emoji);

        itemEl.innerHTML = `
          <div class="history-item-top">
            <span style="font-weight: 700; color: #fff;">${escapeHtml(item.nickname || 'Unknown Player')}</span>
            <span class="history-timestamp">${formattedTime}</span>
          </div>
          <div class="history-details">
            <span class="history-action-text ${actionClass}">${escapeHtml(rawAction)}</span>
            ${formattedEmoji ? `<span style="display:inline-flex; align-items:center;">${formattedEmoji}</span>` : ''}
          </div>
        `;
        list.appendChild(itemEl);
      });
    }

    document.getElementById('historyModal').style.display = 'block';
  }

  function closeHistoryModal() {
    document.getElementById('historyModal').style.display = 'none';
  }

  // Close modal when clicking on background
  window.addEventListener('click', function(e) {
    const modal = document.getElementById('historyModal');
    if (e.target === modal) {
      closeHistoryModal();
    }
  });

  function formatHistoryTimestamp(ts) {
    try {
      const date = new Date(ts);
      if (isNaN(date.getTime())) return ts;
      return date.toLocaleString(undefined, { 
        year: 'numeric', month: 'short', day: '2-digit', 
        hour: '2-digit', minute: '2-digit', second: '2-digit' 
      });
    } catch {
      return ts;
    }
  }

  function formatHistoryEmoji(emojiStr) {
    if (!emojiStr) return '';
    const customIdMatch = emojiStr.match(/<a?:.+:(\d+)>/);
    if (customIdMatch) {
      const emojiId = customIdMatch[1];
      const emojiName = (emojiStr.match(/<a?:([^:]+):/) || [])[1];
      return iconImg(`https://cdn.discordapp.com/emojis/${emojiId}.png`, emojiName, 'height: 20px; width: auto; vertical-align: middle;');
    }
    return `<span style="font-size: 1.1rem; line-height: 1;">${emojiStr}</span>`;
  }

  function escapeHtml(str) {
    if (!str) return '';
    return str
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  /* =========================================
     STORAGE
     ========================================= */
  function getSaved() { return JSON.parse(localStorage.getItem('gw2_rosters_v7') || '{}'); }
  function saveStore(d) { localStorage.setItem('gw2_rosters_v7', JSON.stringify(d)); }
  
  function populateRosterList() {
    const s = document.getElementById('rosterList');
    s.innerHTML = '<option value="">-- Load Roster --</option>';
    const d = getSaved();
    Object.keys(d).forEach(k => {
      const opt = document.createElement('option');
      opt.value = k; opt.textContent = k;
      s.appendChild(opt);
    });
  }

  function saveRoster() {
    const n = document.getElementById('rosterName').value.trim();
    if(!n) return alert('Name required');
    const data = { 
      players: allPlayers, 
      rawText: document.getElementById('inputPlayers').value,
      history: loadedHistory 
    };
    const store = getSaved();
    store[n] = data;
    saveStore(store);
    populateRosterList();
    document.getElementById('rosterList').value = n;
  }

  function loadRosterByName(n) {
    const store = getSaved();
    if(store[n]) {
      const data = store[n];
      if(typeof data === 'string') {
        document.getElementById('inputPlayers').value = data;
        loadedHistory = [];
        updateHistoryButtonState();
        parseAndGenerate();
      } else {
        document.getElementById('inputPlayers').value = data.rawText || '';
        document.getElementById('rosterName').value = n;
        allPlayers = data.players.map(p => ({
            ...p,
            activeRoles: new Set(p.activeRoles),
        }));
        loadedHistory = data.history || [];
        updateHistoryButtonState();
        renderAllCards();
        generateOutput();
      }
    }
  }

  function deleteRoster() {
    const n = document.getElementById('rosterList').value;
    if(!n) return;
    if(!confirm('Delete?')) return;
    const s = getSaved();
    delete s[n];
    saveStore(s);
    populateRosterList();
    document.getElementById('rosterName').value = '';
    loadedHistory = [];
    updateHistoryButtonState();
  }

</script>
</body>
